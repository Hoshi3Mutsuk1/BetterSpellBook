plugins {
    id 'java'
    id "org.jetbrains.kotlin.jvm" version "1.9.0"
    id 'fabric-loom' version '1.8-SNAPSHOT'
}

loom {
    mixin.defaultRefmapName = "hextest.mixins.refmap.json"
//    runs {
//        debugclient {
//            vmArgs "-Dmixin.debug.export=true"
//            client()
//        }
//    }
}

version = project.mod_version
group = project.group

base {
    archivesName = "${modID}-${minecraft_version}"
}

repositories {
    mavenCentral()
    maven { url "https://maven.parchmentmc.org" }
    maven { url 'https://maven.blamejared.com' }
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/" }
    maven { url "https://maven.ladysnake.org/releases" }
    flatDir { dir 'libs' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${minecraft_version}:${parchment_mappings_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modRuntimeOnly "net.fabricmc:fabric-language-kotlin:1.9.5+kotlin.1.8.22"

    modImplementation "${modID}:serialization-hooks:${serialization_hooks_version}"
    ["base", "item", "block", "entity"].forEach {
        modRuntimeOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-${it}:${cca_version}"
    }

    modImplementation("at.petra-k.hexcasting:hexcasting-fabric-$minecraft_version:$hexcasting_version") {
        exclude module: "phosphor"
        exclude module: "lithium"
        exclude module: "emi"
    }
    modRuntimeOnly "com.samsthenerd.inline:inline-fabric:${minecraft_version}-${inline_version}"
    modRuntimeOnly "at.petra-k.paucal:paucal-fabric-${minecraft_version}:${paucal_version}"
    modImplementation "vazkii.patchouli:Patchouli:${minecraft_version}-${patchouli_version}-FABRIC-SNAPSHOT"
    modApi("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

}

processResources {
    def replaceProps = project.properties.clone()

    filesMatching("fabric.mod.json") {
        expand replaceProps
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 17
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}
